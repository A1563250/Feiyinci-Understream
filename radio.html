    <h1>雨夜频段</h1>
    <div class="sub">三段真实声音，被保存在雷雨之间。</div>
  </div>

  <p class="prose">溺川的声音通常不稳定。雨会刮过天线，雷声会压低句尾，远处桥面的震动偶尔让记录中断。可一旦频段接通，声音会比文字更接近那个夜晚。这里只保存妃音·辞本人的真实录音，不使用合成声音替代。每段录音都附有文字稿，静音状态下也能阅读。最后一段频段需要足够的心轨刻度，它不会频繁出现，也不要求所有人抵达。</p>

  <div class="rec-list" id="recList"></div>

  <p class="audio-note">录音文件尚未抵达溺川。上线前需要替换为妃音·辞本人的真实声音；在此之前，频段只保留空的雨噪与文字稿。环境雨声为浏览器本地合成，仅用于氛围，与录音内容无关。</p>

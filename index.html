      <h1>妃音·辞</h1>
      <div class="role">拾遗之诗｜溺川影像档案</div>
      <p class="intro">将自己藏匿在大梦深处，溺于时空的边际。</p>
      <p class="lead">暴雨在楼群之间落下，霓虹被水面折成断续的光。这里不是一座随时开放的城市，只在某些夜晚，与尚未褪色的记忆短暂重合。妃音·辞在此收集那些难以被日常容纳的影像：雨夜里的城市、佚失姓名的角色、沉在梦里的诗章、雾中未熄的灯，以及旧日留下的细小切片。你可以先进入馆藏，查看被打捞上来的光；也可以翻开档案，阅读拾遗者留下的记录。</p>
